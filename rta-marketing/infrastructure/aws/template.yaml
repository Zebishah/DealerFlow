AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: RTA SQS ingestion and dead-letter reconciliation workers

Parameters:
  ScrapeQueueArn:
    Type: String
  ScrapeDlqArn:
    Type: String
  DatabaseUrl:
    Type: String
    NoEcho: true

Resources:
  ScrapeWorker:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: rta-scrape-worker
      CodeUri: ../../backend
      Handler: src/worker/lambda.handler
      Runtime: nodejs22.x
      Architectures: [x86_64]
      MemorySize: 1024
      Timeout: 600
      Environment:
        Variables:
          NODE_ENV: production
          LOG_LEVEL: info
          DATABASE_URL: !Ref DatabaseUrl
          DATABASE_POOL_MAX: "2"
          DATABASE_IDLE_TIMEOUT_MS: "10000"
          DATABASE_CONNECT_TIMEOUT_MS: "5000"
          LIVE_SCRAPING_ENABLED: "false"
          BROWSER_HEADLESS: "true"
          BROWSER_DISABLE_SANDBOX: "true"
          SCRAPE_JOB_TIMEOUT_MS: "540000"
          BROWSER_NAVIGATION_TIMEOUT_MS: "60000"
          SOURCE_MIN_DELAY_MS: "1500"
          SCRAPE_MAX_PAGES_PER_SOURCE: "20"
          SCRAPE_MAX_LISTINGS_PER_SOURCE: "500"
      Events:
        ScrapeQueue:
          Type: SQS
          Properties:
            Queue: !Ref ScrapeQueueArn
            BatchSize: 1
            FunctionResponseTypes: [ReportBatchItemFailures]
            ScalingConfig:
              MaximumConcurrency: 2
            Enabled: true
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [src/worker/lambda.ts]
        Minify: true
        Sourcemap: false
        Target: es2022
        External: [puppeteer]

  DeadLetterReconciler:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: rta-scrape-dlq-reconciler
      CodeUri: ../../backend
      Handler: src/worker/dead-letter.handler
      Runtime: nodejs22.x
      Architectures: [x86_64]
      MemorySize: 256
      Timeout: 60
      Environment:
        Variables:
          NODE_ENV: production
          LOG_LEVEL: info
          DATABASE_URL: !Ref DatabaseUrl
          DATABASE_POOL_MAX: "1"
          DATABASE_IDLE_TIMEOUT_MS: "10000"
          DATABASE_CONNECT_TIMEOUT_MS: "5000"
      Events:
        ScrapeDeadLetterQueue:
          Type: SQS
          Properties:
            Queue: !Ref ScrapeDlqArn
            BatchSize: 10
            FunctionResponseTypes: [ReportBatchItemFailures]
            ScalingConfig:
              MaximumConcurrency: 2
            Enabled: true
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [src/worker/dead-letter.ts]
        Minify: true
        Sourcemap: false
        Target: es2022

Outputs:
  WorkerFunctionArn:
    Value: !GetAtt ScrapeWorker.Arn
  DeadLetterReconcilerFunctionArn:
    Value: !GetAtt DeadLetterReconciler.Arn
