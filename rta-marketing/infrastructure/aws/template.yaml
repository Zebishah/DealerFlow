AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: RTA SQS ingestion and dead-letter reconciliation workers

Parameters:
  ScrapeQueueArn:
    Type: String
  ScrapeDlqArn:
    Type: String
  DatabaseUrl:
    Type: String
    NoEcho: true
  LiveScrapingEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  ChromiumLayerArn:
    Type: String
    Default: ""
    Description: Optional @sparticuz/chromium x86_64 layer ARN for live scraping
  EnableSqsTrigger:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Enable only for an explicitly configured AWS showcase deployment

Conditions:
  HasChromiumLayer: !Not [!Equals [!Ref ChromiumLayerArn, ""]]

Resources:
  ScrapeWorker:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: rta-scrape-worker
      CodeUri: ../../apps/dealership-api
      Handler: src/worker/lambda.handler
      Runtime: nodejs22.x
      Architectures: [x86_64]
      MemorySize: 1024
      Timeout: 600
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - sqs:ReceiveMessage
                - sqs:DeleteMessage
                - sqs:GetQueueAttributes
              Resource: !Ref ScrapeQueueArn
            - Effect: Allow
              Action: [sqs:SendMessage]
              Resource: !Ref ScrapeDlqArn
      Layers: !If
        - HasChromiumLayer
        - [!Ref ChromiumLayerArn]
        - !Ref AWS::NoValue
      Environment:
        Variables:
          NODE_ENV: production
          LOG_LEVEL: info
          DATABASE_URL: !Ref DatabaseUrl
          DATABASE_POOL_MAX: "2"
          DATABASE_IDLE_TIMEOUT_MS: "10000"
          DATABASE_CONNECT_TIMEOUT_MS: "5000"
          LIVE_SCRAPING_ENABLED: !Ref LiveScrapingEnabled
          SQS_SCRAPE_DLQ_URL: !Sub
            - 'https://sqs.${AWS::Region}.${AWS::URLSuffix}/${AWS::AccountId}/${QueueName}'
            - QueueName: !Select [5, !Split [":", !Ref ScrapeDlqArn]]
          BROWSER_HEADLESS: "true"
          BROWSER_DISABLE_SANDBOX: "true"
          SCRAPE_JOB_TIMEOUT_MS: "540000"
          BROWSER_NAVIGATION_TIMEOUT_MS: "60000"
          SOURCE_MIN_DELAY_MS: "1500"
          SCRAPE_MAX_PAGES_PER_SOURCE: "20"
          SCRAPE_MAX_LISTINGS_PER_SOURCE: "500"
      Events:
        ScrapeQueue:
          Type: SQS
          Properties:
            Queue: !Ref ScrapeQueueArn
            BatchSize: 1
            FunctionResponseTypes: [ReportBatchItemFailures]
            ScalingConfig:
              MaximumConcurrency: 2
            Enabled: !Equals [!Ref EnableSqsTrigger, "true"]
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [src/worker/lambda.ts]
        Minify: true
        Sourcemap: false
        Target: es2022
        External: ["@sparticuz/chromium"]

  DeadLetterReconciler:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: rta-scrape-dlq-reconciler
      CodeUri: ../../apps/dealership-api
      Handler: src/worker/dead-letter.handler
      Runtime: nodejs22.x
      Architectures: [x86_64]
      MemorySize: 256
      Timeout: 60
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - sqs:ReceiveMessage
                - sqs:DeleteMessage
                - sqs:GetQueueAttributes
              Resource: !Ref ScrapeDlqArn
      Environment:
        Variables:
          NODE_ENV: production
          LOG_LEVEL: info
          DATABASE_URL: !Ref DatabaseUrl
          DATABASE_POOL_MAX: "1"
          DATABASE_IDLE_TIMEOUT_MS: "10000"
          DATABASE_CONNECT_TIMEOUT_MS: "5000"
      Events:
        ScrapeDeadLetterQueue:
          Type: SQS
          Properties:
            Queue: !Ref ScrapeDlqArn
            BatchSize: 10
            FunctionResponseTypes: [ReportBatchItemFailures]
            ScalingConfig:
              MaximumConcurrency: 2
            Enabled: !Equals [!Ref EnableSqsTrigger, "true"]
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [src/worker/dead-letter.ts]
        Minify: true
        Sourcemap: false
        Target: es2022

  ScrapeAlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: rta-scrape-alarms

  ScrapeWorkerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Scrape worker emitted one or more errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ScrapeWorker
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref ScrapeAlarmTopic]

  ScrapeWorkerThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Scrape worker invocation was throttled
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref ScrapeWorker
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref ScrapeAlarmTopic]

  ScrapeWorkerDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Scrape worker is approaching its 600-second timeout
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref ScrapeWorker
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 540000
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref ScrapeAlarmTopic]

  ScrapeQueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Oldest scrape message has waited for more than five minutes
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !Select [5, !Split [":", !Ref ScrapeQueueArn]]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 300
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref ScrapeAlarmTopic]

  ScrapeQueueBacklogAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Scrape queue has a sustained visible backlog
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !Select [5, !Split [":", !Ref ScrapeQueueArn]]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 10
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref ScrapeAlarmTopic]

  ScrapeDlqMessagesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: One or more scrape messages reached the dead-letter queue
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !Select [5, !Split [":", !Ref ScrapeDlqArn]]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref ScrapeAlarmTopic]

  DeadLetterReconcilerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Dead-letter reconciliation emitted one or more errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref DeadLetterReconciler
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref ScrapeAlarmTopic]

Outputs:
  WorkerFunctionArn:
    Value: !GetAtt ScrapeWorker.Arn
  DeadLetterReconcilerFunctionArn:
    Value: !GetAtt DeadLetterReconciler.Arn
  ScrapeAlarmTopicArn:
    Value: !Ref ScrapeAlarmTopic
