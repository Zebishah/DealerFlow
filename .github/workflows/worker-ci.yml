name: Worker CI/CD

on:
  push:
    branches:
      - portfolio-hardening
  pull_request:
    branches:
      - portfolio-hardening
  workflow_dispatch:

concurrency:
  group: rta-worker-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/zebishah/rta-worker

permissions:
  contents: read

jobs:
  validate:
    name: Validate scraping stack
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rta-marketing
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: rta-marketing/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Build all workspaces
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Run lint when configured
        run: npm run lint --if-present

      - name: Typecheck Vercel server function
        run: npx tsc --noEmit --target ES2020 --module NodeNext --moduleResolution NodeNext --strict --skipLibCheck --types node 'api/[...path].ts'

      - name: Build worker image
        run: docker build -f apps/scraping-worker/Dockerfile -t rta-worker:ci .

  publish-and-deploy:
    name: Publish and deploy Azure worker
    if: (github.event_name == 'push' && github.ref == 'refs/heads/portfolio-hardening') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/portfolio-hardening')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: ./rta-marketing
          file: ./rta-marketing/apps/scraping-worker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure SSH
        shell: bash
        env:
          AZURE_VM_KNOWN_HOSTS: ${{ secrets.AZURE_VM_KNOWN_HOSTS }}
          AZURE_VM_SSH_KEY: ${{ secrets.AZURE_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$AZURE_VM_SSH_KEY" > "$HOME/.ssh/rta-worker"
          chmod 600 "$HOME/.ssh/rta-worker"
          printf '%s\n' "$AZURE_VM_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Log Azure VM into GHCR
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          AZURE_VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          AZURE_VM_USER: ${{ secrets.AZURE_VM_USER }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_READ_TOKEN" | ssh -i "$HOME/.ssh/rta-worker" "$AZURE_VM_USER@$AZURE_VM_HOST" "docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin"

      - name: Copy deployment script
        env:
          AZURE_VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          AZURE_VM_USER: ${{ secrets.AZURE_VM_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/rta-worker" "$AZURE_VM_USER@$AZURE_VM_HOST" 'mkdir -p ~/rta-worker'
          scp -i "$HOME/.ssh/rta-worker" rta-marketing/deploy/azure/deploy-worker.sh "$AZURE_VM_USER@$AZURE_VM_HOST:~/rta-worker/deploy-worker.sh"
          ssh -i "$HOME/.ssh/rta-worker" "$AZURE_VM_USER@$AZURE_VM_HOST" 'chmod 700 ~/rta-worker/deploy-worker.sh'

      - name: Deploy commit image to Azure
        env:
          AZURE_VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          AZURE_VM_USER: ${{ secrets.AZURE_VM_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/rta-worker" "$AZURE_VM_USER@$AZURE_VM_HOST" "~/rta-worker/deploy-worker.sh '${IMAGE_NAME}:${GITHUB_SHA}'"
