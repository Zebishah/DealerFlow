name: Refresh vulnerable dependency lockfile
on:
  push:
    branches: [fix/secure-auth-email-links]
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rta-marketing/package-lock.json
      - name: Refresh lockfile with non-breaking security fixes
        working-directory: rta-marketing
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: |
          npm ci
          npm audit fix --omit=dev || echo "Some security advisories require separate review"
          npm audit --workspace=@rta/dealership-web --omit=dev --audit-level=high || true
          npm audit --workspace=@rta/dealership-api --omit=dev --audit-level=high || true
      - name: Commit supported dependency updates
        run: |
          if git diff --quiet; then
            echo "No compatible dependency updates were generated"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rta-marketing/package-lock.json rta-marketing/package.json rta-marketing/apps/dealership-api/package.json rta-marketing/apps/dealership-web/package.json
          git diff --cached --quiet && exit 0
          git commit -m "fix(deps): apply compatible npm security updates"
          git push origin HEAD:fix/secure-auth-email-links
