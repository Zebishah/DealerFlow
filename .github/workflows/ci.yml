name: CI

on:
  pull_request:
  push:
    branches: [main, portfolio-hardening]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: rta_test
          POSTGRES_USER: rta_test
          POSTGRES_PASSWORD: rta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rta_test -d rta_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: rta-marketing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rta-marketing/package-lock.json
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - run: npm audit --workspace=@rta/dealership-api --omit=dev --audit-level=high
      - run: npm run typecheck --workspace=@rta/dealership-api
      - run: npm run lint --workspace=@rta/dealership-api
      - run: cp apps/dealership-api/.env.test.example apps/dealership-api/.env.test
      # The isolated CI database also needs the shared scraping tables referenced
      # by dealership migrations. Keep the two migration histories independent.
      - name: Prepare shared scraping tables for test database
        env:
          PGPASSWORD: rta_test
        run: |
          for migration in packages/db/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U rta_test -d rta_test -f "$migration"
          done
      - run: node --env-file=apps/dealership-api/.env.test --import tsx apps/dealership-api/src/db/migrate.ts
      - run: npm test --workspace=@rta/dealership-api
        env:
          RUN_DATABASE_TESTS: "true"
      - run: npm run build --workspace=@rta/dealership-api
      - uses: aws-actions/setup-sam@v2
      - run: sam validate --lint --template-file infrastructure/aws/template.yaml
      - name: Build SAM application
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          sam build --template-file infrastructure/aws/template.yaml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rta-marketing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rta-marketing/package-lock.json
      - run: npm ci
      - run: npm audit --workspace=@rta/dealership-web --omit=dev --audit-level=high
      - run: npm run lint --workspace=@rta/dealership-web
      - run: npm run typecheck --workspace=@rta/dealership-web
      - run: npm test --workspace=@rta/dealership-web
      - run: npx playwright install --with-deps firefox
      - run: npm run test:e2e --workspace=@rta/dealership-web
        env:
          VITE_API_URL: http://localhost:5000/api/v1
