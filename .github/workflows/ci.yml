name: CI

on:
  pull_request:
  push:
    branches: [main, portfolio-hardening]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: rta_test
          POSTGRES_USER: rta_test
          POSTGRES_PASSWORD: rta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rta_test -d rta_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: rta-marketing/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rta-marketing/backend/package-lock.json
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: node --env-file=.env.test --import tsx src/db/migrate.ts
      - run: npm test
        env:
          RUN_DATABASE_TESTS: "true"
      - run: npm run build
      - uses: aws-actions/setup-sam@v2
      - run: sam validate --lint --template-file ../infrastructure/aws/template.yaml
      - name: Build SAM application
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          sam build --template-file ../infrastructure/aws/template.yaml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rta-marketing/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rta-marketing/frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_API_URL: http://localhost:5000/api/v1
